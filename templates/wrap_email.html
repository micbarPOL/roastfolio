<!DOCTYPE html>
<html lang="pl" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>%%TITLE%%</title>
    <style type="text/css">
      body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
      table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
      img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
      table { border-collapse: collapse !important; }
      body { margin: 0; padding: 0; width: 100% !important; }
      a { text-decoration: none; }
      @media screen and (max-width: 600px) {
        .outer-shell { width: 100% !important; }
        .inner-shell { width: 100% !important; }
        .mobile-stack { display: block !important; width: 100% !important; }
        .mobile-column { display: block !important; width: 100% !important; }
        .mobile-pad { padding-left: 18px !important; padding-right: 18px !important; }
        .mobile-center { text-align: center !important; }
        .stat-row td { display: block !important; width: 100% !important; }
        .split-panel { display: block !important; width: 100% !important; }
      }
    </style>
  </head>
  <body style="margin:0; padding:0; background-color:#111827; font-family:Arial, Helvetica, sans-serif; color:#f9fafb;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:linear-gradient(180deg,#111827 0%,#0b1220 100%); margin:0; padding:0; width:100%;">
      <tr>
        <td align="center" style="padding:28px 18px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" class="outer-shell" style="max-width:640px; width:100%; background:linear-gradient(180deg,#0f172a 0%,#111827 100%); border:1px solid #243244; border-radius:20px; overflow:hidden;">
            <tr>
              <td style="padding:26px 22px 18px 22px; background:linear-gradient(180deg,#151d2d 0%,#111827 100%); border-bottom:1px solid #243244;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td align="center" style="padding-bottom:12px;">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                        <tr>
                          <td style="padding-right:12px; vertical-align:middle;">
                            <img src="https://roastfolio.app/data/logos/icon-512.png" alt="Roastfolio" width="42" height="42" style="display:block; width:42px; height:42px; border-radius:12px;" />
                          </td>
                          <td style="font-size:15px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#f8fafc; text-align:left;">
                            Roastfolio
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="font-size:30px; line-height:36px; font-weight:800; color:#f8fafc; letter-spacing:-0.8px; padding-top:4px;">
                      %%TITLE%%
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="font-size:13px; line-height:20px; color:#cbd5e1; padding-top:8px;">
                      %%USER_NAME%% · %%PERIOD_LABEL%%
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td class="mobile-pad" style="padding:18px 22px 16px 22px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:linear-gradient(180deg,#121b2d 0%,#0f172a 100%); border:1px solid #243244; border-radius:14px; overflow:hidden;">
                  <tr>
                    <td style="padding:16px 18px 12px 18px; border-bottom:1px solid #243244; font-size:12px; letter-spacing:1.25px; text-transform:uppercase; color:#94a3b8; font-weight:700;">
                      Wallet Comparison
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:0;">
                      %%WALLET_ROWS%%
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td class="mobile-pad" style="padding:0 22px 16px 22px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:linear-gradient(180deg,#121b2d 0%,#0f172a 100%); border:1px solid #243244; border-radius:14px; overflow:hidden;">
                  <tr>
                    <td style="padding:16px 18px 12px 18px; border-bottom:1px solid #243244; font-size:12px; letter-spacing:1.25px; text-transform:uppercase; color:#94a3b8; font-weight:700;">
                      Benchmark Alignment
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:0;">
                      %%BENCHMARK_ROWS%%
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td class="mobile-pad" style="padding:0 22px 18px 22px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" class="split-panel" style="border-collapse:separate; border-spacing:0;">
                  <tr>
                    <td class="mobile-column" width="50%" valign="top" style="padding:0 8px 0 0;">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:linear-gradient(180deg,#0b3a30 0%,#0a2f2a 100%); border:1px solid #1d7a67; border-radius:14px; overflow:hidden;">
                        <tr>
                          <td style="padding:16px 18px 8px 18px; font-size:11px; letter-spacing:1.25px; text-transform:uppercase; color:#b8f1df; font-weight:700;">
                            The Carry
                          </td>
                        </tr>
                        <tr>
                          <td style="padding:0 18px 10px 18px; font-size:24px; line-height:1.2; font-weight:800; color:#f0fdf4;">
                            %%CARRY_VALUE%%
                          </td>
                        </tr>
                        <tr>
                          <td style="padding:0 18px 18px 18px; font-size:14px; color:#d1fae5; font-weight:600;">
                            %%CARRY_NAME%%
                          </td>
                        </tr>
                      </table>
                    </td>
                    <td class="mobile-column" width="50%" valign="top" style="padding:0 0 0 8px;">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:linear-gradient(180deg,#3a1f20 0%,#2d1b1b 100%); border:1px solid #7f3d3d; border-radius:14px; overflow:hidden;">
                        <tr>
                          <td style="padding:16px 18px 8px 18px; font-size:11px; letter-spacing:1.25px; text-transform:uppercase; color:#f7c7c7; font-weight:700;">
                            The Anchor
                          </td>
                        </tr>
                        <tr>
                          <td style="padding:0 18px 10px 18px; font-size:24px; line-height:1.2; font-weight:800; color:#fff1f2;">
                            %%ANCHOR_VALUE%%
                          </td>
                        </tr>
                        <tr>
                          <td style="padding:0 18px 18px 18px; font-size:14px; color:#fecaca; font-weight:600;">
                            %%ANCHOR_NAME%%
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            %%DIARY_BLOCK%%

            <tr>
              <td class="mobile-pad" style="padding:0 22px 26px 22px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td align="center" style="padding-top:6px;">
                      <a href="%%CTA_URL%%" style="display:inline-block; background:linear-gradient(135deg,#a78bfa 0%,#7c3aed 40%,#d8b4fe 100%); border-radius:999px; color:#ffffff; font-size:15px; font-weight:700; letter-spacing:0.2px; padding:16px 30px; text-decoration:none; box-shadow:0 12px 28px rgba(124,58,237,0.35);">
                        Otwórz panel analizy
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
