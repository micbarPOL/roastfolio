<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roast Telemetry Dashboard | Roastfolio</title>
    <link rel="stylesheet" href="styles/index.css">
    <style>
        .telemetry-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .telemetry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
        }
        .telemetry-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .telemetry-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }
        .telemetry-card h2 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 1rem;
            color: #e2e8f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        th {
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            background: rgba(255, 255, 255, 0.02);
        }
        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge.green { background: rgba(39, 174, 96, 0.2); color: #2ecc71; }
        .badge.red { background: rgba(192, 57, 43, 0.2); color: #e74c3c; }
        .badge.yellow { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }
        .loading {
            text-align: center;
            padding: 3rem;
            color: #94a3b8;
            font-style: italic;
        }
        .nav-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .error-msg {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="auth-overlay" class="auth-overlay" style="display:none;">
        <div class="auth-box">
            <h2>Sign In</h2>
            <p>You must be signed in to view telemetry data.</p>
            <div id="firebaseui-auth-container"></div>
        </div>
    </div>

    <div class="telemetry-container" id="main-ui" style="display:none;">
        <div class="telemetry-header">
            <h1>Roast Telemetry Dashboard</h1>
            <a href="index.html" class="nav-btn">← Back to Dashboard</a>
        </div>

        <div id="telemetry-content">
            <div class="loading">Loading telemetry data...</div>
        </div>
    </div>

    <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.js"></script>
    <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.css" />

    <script src="scripts/config.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/telemetry.js"></script>
</body>
</html>
