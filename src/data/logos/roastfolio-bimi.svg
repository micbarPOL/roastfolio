<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps" viewBox="0 0 512 512" width="512" height="512">
  <title>Roastfolio Logo</title>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050813" />
    </linearGradient>

    <!-- Candlestick Neon Green Gradient -->
    <linearGradient id="candleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Purple Neon Glow Gradient -->
    <linearGradient id="neonPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Wick Purple -->
    <linearGradient id="wickPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>

  <!-- Base Badge / Squircle Backdrop -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1a2540" stroke-width="4" />

  <!-- Candlestick Wick (vertical line) -->
  <line x1="186" y1="110" x2="186" y2="382" stroke="url(#wickPurple)" stroke-width="12" stroke-linecap="round" />

  <!-- Outer Neon 'R' Loop & Leg -->
  <path d="M 216,132 L 302,132 C 354,132 376,158 376,204 C 376,248 350,274 300,276 L 226,276 M 304,276 L 370,378"
        fill="none" stroke="url(#neonPurple)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner Neon 'R' Trace -->
  <path d="M 226,170 L 298,170 C 328,170 342,184 342,204 C 342,226 326,238 296,238 L 226,238"
        fill="none" stroke="url(#neonPurple)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Candlestick Body Pill (Green) -->
  <rect x="158" y="154" width="56" height="184" rx="18" fill="none" stroke="url(#candleGrad)" stroke-width="12" />
</svg>
