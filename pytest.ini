[pytest]
testpaths = tests
norecursedirs = .git .venv node_modules tmp scratch
addopts = -ra -q --ignore=tests/test_monthly_audit_browser.py --ignore=tests/test_benchmark_consent_browser.py
markers =
    smoke: Fast smoke and UI contract tests required after UI changes (< 1s)
    full: Comprehensive unit, calculation, and backend tests
    browser: Playwright Chromium browser regression tests
